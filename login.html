<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jones Soda | Sign in</title><style>*{box-sizing:border-box}body{font:16px Arial,sans-serif;background:#f5eee6;color:#172a36;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}main{width:min(100%,410px);background:#fffaf4;padding:32px;border-radius:12px;box-shadow:0 14px 40px #10263822}h1{font:700 30px Georgia,serif;margin:10px 0 8px}p{color:#665f5a;line-height:1.5}label{display:block;font-weight:bold;margin:22px 0 8px}input{font:inherit;border:1px solid #beb1a6;border-radius:6px;padding:12px;width:100%}button{font:inherit;font-weight:bold;background:#102638;color:white;border:0;border-radius:6px;padding:13px;width:100%;margin-top:16px;cursor:pointer}button:disabled{opacity:.6}#message{color:#aa3028;min-height:20px}</style></head><body><main><small>JONES SODA · GROWTH PERFORMANCE</small><h1>Dashboard access</h1><p>Enter the shared dashboard password to view performance reporting.</p><form id="form"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Sign in</button><p id="message" role="alert"></p></form></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Sign in failed');const next=new URLSearchParams(location.search).get('next')||'/dashboard.html';location.replace(next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard.html')}catch(err){message.textContent=err.message}finally{button.disabled=false}})</script></body></html>
